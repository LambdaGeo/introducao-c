site_name: "C para Programadores Python e VisuAlg"
site_description: "Adaptado de 'C for Python Programmers' (Carl Burch / Elizabeth Patitsas), ampliado com comparações e exercícios de mapeamento Python/VisuAlg → C."
site_author: "Sergio Costa"

# Troque pelo seu usuário/repositório do GitHub antes de publicar:
# site_url: https://SEU-USUARIO.github.io/SEU-REPOSITORIO/
# repo_url: https://github.com/SEU-USUARIO/SEU-REPOSITORIO
# repo_name: SEU-USUARIO/SEU-REPOSITORIO

docs_dir: docs

theme:
  name: material
  language: pt
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow

nav:
  - Início: index.md
  - "1. Construindo um simples programa": cap01.md
  - "2. Expressões e comandos": cap02.md
  - "3. Bibliotecas": cap03.md
  - "4. Vetores e Strings": cap04.md
  - "5. Structs (registros)": cap05.md
  - "6. Ponteiros e Alocação Dinâmica": cap06.md
  - "7. Compilação Separada e Bibliotecas Externas": cap07.md
  - "Conclusão e Próximos Passos": conclusao.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

extra_css:
  - stylesheets/lambdageo.css

extra:
  social: []